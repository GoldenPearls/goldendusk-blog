<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoldenDusk.log</title>
<meta name="description" content="황혼의 서재 — GoldenDusk의 개발, 회고, 일상 기록">
<style>
@font-face {
  font-family: 'Cafe24Surround';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/Cafe24Ssurround.woff') format('woff');
  font-weight: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Pretendard';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Regular.woff2') format('woff2');
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: 'Pretendard';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Medium.woff2') format('woff2');
  font-weight: 500;
  font-display: swap;
}
@font-face {
  font-family: 'Pretendard';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-SemiBold.woff2') format('woff2');
  font-weight: 600;
  font-display: swap;
}

:root {
  --bg: #F7F2EB;
  --bg-alt: #EFE8DE;
  --card: #FFFCF7;
  --card-hover: #FFF8F0;
  --text: #3D3228;
  --text-2: #6B5E50;
  --text-3: #9E8E7A;
  --accent: #C4A882;
  --accent-soft: rgba(196,168,130,0.15);
  --sunset: #D4886B;
  --sunset-soft: rgba(212,136,107,0.12);
  --leather: #8B7355;
  --plant: #6B8F6B;
  --plant-soft: rgba(107,143,107,0.12);
  --sky: #7A9EB8;
  --sky-soft: rgba(122,158,184,0.12);
  --ink: #3D3228;
  --border: rgba(61,50,40,0.10);
  --shadow-sm: 0 2px 8px rgba(61,50,40,0.06);
  --shadow-md: 0 4px 20px rgba(61,50,40,0.08);
  --shadow-lg: 0 8px 40px rgba(61,50,40,0.12);
  --shadow-card: 0 1px 3px rgba(61,50,40,0.06), 0 4px 12px rgba(61,50,40,0.04);
  --radius: 14px;
  --radius-sm: 10px;
  --radius-xs: 6px;
  --max-w: 1080px;
  --title: 'Cafe24Surround', 'Apple SD Gothic Neo', sans-serif;
  --body: 'Pretendard', 'Apple SD Gothic Neo', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: 'Fira Code', 'Cascadia Code', Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E1A15;
    --bg-alt: #262019;
    --card: #2A2420;
    --card-hover: #332C26;
    --text: #E8DFD4;
    --text-2: #B8A898;
    --text-3: #7A6E60;
    --accent: #D4B896;
    --accent-soft: rgba(212,184,150,0.15);
    --sunset: #D4886B;
    --sunset-soft: rgba(212,136,107,0.15);
    --leather: #A8906E;
    --plant: #7DA87D;
    --plant-soft: rgba(125,168,125,0.12);
    --sky: #8AB0CA;
    --sky-soft: rgba(138,176,202,0.12);
    --border: rgba(255,255,255,0.08);
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
    --shadow-md: 0 4px 20px rgba(0,0,0,0.25);
    --shadow-lg: 0 8px 40px rgba(0,0,0,0.3);
    --shadow-card: 0 1px 3px rgba(0,0,0,0.15), 0 4px 12px rgba(0,0,0,0.1);
  }
}
:root[data-theme="dark"] {
  --bg: #1E1A15;
  --bg-alt: #262019;
  --card: #2A2420;
  --card-hover: #332C26;
  --text: #E8DFD4;
  --text-2: #B8A898;
  --text-3: #7A6E60;
  --accent: #D4B896;
  --accent-soft: rgba(212,184,150,0.15);
  --sunset: #D4886B;
  --sunset-soft: rgba(212,136,107,0.15);
  --leather: #A8906E;
  --plant: #7DA87D;
  --plant-soft: rgba(125,168,125,0.12);
  --sky: #8AB0CA;
  --sky-soft: rgba(138,176,202,0.12);
  --border: rgba(255,255,255,0.08);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
  --shadow-md: 0 4px 20px rgba(0,0,0,0.25);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.3);
  --shadow-card: 0 1px 3px rgba(0,0,0,0.15), 0 4px 12px rgba(0,0,0,0.1);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  font-weight: 400;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
button { cursor: pointer; border: none; background: none; font-family: inherit; color: inherit; }
img { max-width: 100%; display: block; }
[hidden] { display: none !important; }

.container { max-width: var(--max-w); margin: 0 auto; padding: 0 24px; }

/* ========== HEADER ========== */
.site-header {
  position: sticky;
  top: 0;
  z-index: 200;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  max-width: var(--max-w);
  margin: 0 auto;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.logo {
  font-family: var(--title);
  font-size: 20px;
  white-space: nowrap;
  letter-spacing: -0.01em;
}
.logo em { font-style: normal; color: var(--accent); }
.header-search {
  flex: 1;
  max-width: 320px;
  position: relative;
}
.header-search svg {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  width: 15px; height: 15px; color: var(--text-3);
}
.search-input {
  width: 100%;
  padding: 9px 14px 9px 38px;
  border: 1px solid var(--border);
  border-radius: 24px;
  background: var(--card);
  color: var(--text);
  font-size: 13px;
  font-family: var(--body);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.search-input::placeholder { color: var(--text-3); }
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}
.theme-toggle {
  width: 34px; height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  background: var(--bg-alt);
  transition: background 0.2s;
}
.theme-toggle:hover { background: var(--accent-soft); }
.header-nav {
  display: flex;
  gap: 3px;
}
.nav-btn {
  padding: 7px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-3);
  transition: all 0.15s;
}
.nav-btn:hover { background: var(--accent-soft); color: var(--accent); }
.nav-btn.active { background: var(--accent); color: #fff; }

/* ========== HERO ========== */
.hero {
  padding: 52px 0 36px;
  text-align: center;
  position: relative;
}
.hero-cat {
  display: block;
  margin: 0 auto 16px;
  font-size: 42px;
  line-height: 1;
  opacity: 0.9;
}
.hero-title {
  font-family: var(--title);
  font-size: clamp(26px, 5vw, 38px);
  line-height: 1.3;
  text-wrap: balance;
  margin-bottom: 10px;
}
.hero-title em { font-style: normal; color: var(--accent); }
.hero-sub {
  font-size: 15px;
  color: var(--text-2);
  margin-bottom: 24px;
  line-height: 1.6;
}
.hero-stats {
  display: flex;
  justify-content: center;
  gap: 32px;
  font-variant-numeric: tabular-nums;
}
.stat { display: flex; flex-direction: column; align-items: center; }
.stat-num {
  font-family: var(--title);
  font-size: 28px;
  color: var(--accent);
  line-height: 1.1;
}
.stat-label {
  font-size: 11px;
  color: var(--text-3);
  letter-spacing: 0.06em;
  margin-top: 4px;
}

/* ========== TIMELINE (회고록) ========== */
.timeline-section { padding: 20px 0 32px; }
.section-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 16px;
}
.section-title {
  font-family: var(--title);
  font-size: 18px;
}
.section-sub { font-size: 12px; color: var(--text-3); }

.timeline-track {
  position: relative;
  padding: 20px 0 10px;
}
.timeline-line {
  position: absolute;
  top: 40px;
  left: 30px;
  right: 30px;
  height: 2px;
  background: var(--border);
}
.paw-trail {
  position: absolute;
  top: 33px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-around;
  pointer-events: none;
  z-index: 1;
}
.paw {
  font-size: 16px;
  opacity: 0.4;
  transform: rotate(-20deg);
  transition: opacity 0.3s, transform 0.3s;
}
.paw.active { opacity: 0.8; transform: rotate(-20deg) scale(1.2); }

.timeline-scroll {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  padding: 16px 4px 12px;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  position: relative;
  z-index: 2;
}
.timeline-scroll::-webkit-scrollbar { display: none; }

.tl-card {
  flex: 0 0 200px;
  scroll-snap-align: start;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.3s;
  position: relative;
}
.tl-card:hover { transform: translateY(-4px) rotate(-1deg); }
.tl-card::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--sunset));
}

.tl-grad {
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--title);
  font-size: 28px;
  color: #fff;
  position: relative;
}
.tl-card:nth-child(1) .tl-grad { background: linear-gradient(135deg, #C4A882, #D4886B); }
.tl-card:nth-child(2) .tl-grad { background: linear-gradient(135deg, #D4886B, #B87D5E); }
.tl-card:nth-child(3) .tl-grad { background: linear-gradient(135deg, #8B7355, #C4A882); }
.tl-card:nth-child(4) .tl-grad { background: linear-gradient(135deg, #7A9EB8, #C4A882); }
.tl-card:nth-child(5) .tl-grad { background: linear-gradient(135deg, #6B8F6B, #C4A882); }

.tl-body { padding: 10px 14px 14px; }
.tl-title {
  font-family: var(--body);
  font-size: 13px;
  font-weight: 500;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 4px;
}
.tl-date { font-size: 11px; color: var(--text-3); }
.tl-paw {
  position: absolute;
  top: 8px;
  right: 10px;
  font-size: 14px;
  opacity: 0.5;
}

/* ========== CATEGORIES ========== */
.cat-section { padding: 8px 0 24px; }
.cat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 10px;
}
.cat-widget {
  background: var(--card);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  padding: 14px 10px;
  text-align: center;
  cursor: pointer;
  transition: transform 0.15s, border-color 0.2s, background 0.2s;
}
.cat-widget:hover { transform: translateY(-2px); border-color: var(--accent); }
.cat-widget.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.cat-emoji { font-size: 22px; margin-bottom: 4px; }
.cat-name {
  font-family: var(--body);
  font-size: 12px;
  font-weight: 500;
  line-height: 1.3;
}
.cat-count {
  font-size: 11px;
  color: var(--text-3);
  margin-top: 2px;
}
.cat-widget.active .cat-count { color: rgba(255,255,255,0.7); }

/* ========== SOURCE FILTER ========== */
.source-filter {
  display: flex;
  gap: 3px;
  background: var(--bg-alt);
  border-radius: 24px;
  padding: 3px;
  width: fit-content;
  margin-bottom: 16px;
}
.src-btn {
  padding: 7px 18px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-3);
  transition: all 0.15s;
}
.src-btn.active { background: var(--card); color: var(--text); box-shadow: var(--shadow-sm); }
.src-btn .cnt { font-size: 11px; margin-left: 4px; opacity: 0.6; }

/* ========== POST GRID ========== */
.posts-section { padding: 0 0 60px; }
.results-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  font-size: 13px;
  color: var(--text-3);
}
.post-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
}
.post-card {
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
}
.post-card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: var(--shadow-md); }
.post-thumb {
  height: 140px;
  background-size: cover;
  background-position: center;
  position: relative;
}
.post-thumb .src-tag {
  position: absolute;
  top: 10px;
  right: 10px;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.04em;
}
.src-tag.velog { background: rgba(32,178,170,0.85); color: #fff; }
.src-tag.gitbook { background: rgba(139,115,85,0.85); color: #fff; }
.post-body { padding: 14px 16px; }
.post-cat-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 500;
  color: var(--leather);
  margin-bottom: 6px;
}
.post-title-text {
  font-family: var(--title);
  font-size: 15px;
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 8px;
}
.post-preview-text {
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.55;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 10px;
}
.post-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
}

.load-more-btn {
  display: block;
  margin: 28px auto;
  padding: 12px 36px;
  border-radius: 24px;
  background: var(--card);
  border: 1px solid var(--border);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-2);
  transition: all 0.2s;
}
.load-more-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ========== POST DETAIL ========== */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 500;
  background: rgba(30,26,21,0.5);
  backdrop-filter: blur(4px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.overlay.open { opacity: 1; pointer-events: auto; }

.detail-panel {
  position: fixed;
  top: 0; right: 0;
  width: min(720px, 100vw);
  height: 100vh;
  background: var(--card);
  z-index: 510;
  overflow-y: auto;
  transform: translateX(100%);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: -8px 0 40px rgba(0,0,0,0.15);
}
.detail-panel.open { transform: translateX(0); }

.detail-header {
  position: sticky;
  top: 0;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 10;
}
.close-btn {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  color: var(--text-2);
  font-size: 18px;
  transition: background 0.15s;
}
.close-btn:hover { background: var(--accent-soft); color: var(--accent); }
.detail-header-title {
  font-size: 14px;
  font-weight: 500;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.original-link {
  padding: 6px 14px;
  border-radius: 16px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
}
.original-link:hover { background: var(--accent); color: #fff; }
.detail-hero {
  height: 200px;
  background-size: cover;
  background-position: center;
}
.detail-body {
  padding: 32px 40px 60px;
  max-width: 640px;
  margin: 0 auto;
}
.detail-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
  font-size: 13px;
  color: var(--text-3);
}
.detail-meta .cat-badge {
  padding: 3px 10px;
  border-radius: 12px;
  background: var(--accent-soft);
  color: var(--leather);
  font-weight: 500;
  font-size: 12px;
}
.detail-title {
  font-family: var(--title);
  font-size: clamp(22px, 4vw, 30px);
  line-height: 1.4;
  margin-bottom: 28px;
  text-wrap: balance;
}

/* scroll progress paw trail */
.scroll-paws {
  position: fixed;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 520;
  display: flex;
  flex-direction: column;
  gap: 8px;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.detail-panel.open .scroll-paws { opacity: 1; }
.scroll-paw {
  font-size: 12px;
  opacity: 0.15;
  transition: opacity 0.3s;
}
.scroll-paw.filled { opacity: 0.6; }

/* ========== MARKDOWN ========== */
.md-content { font-size: 15px; line-height: 1.85; color: var(--text); font-family: var(--body); }
.md-content h1 { font-family: var(--title); font-size: 22px; margin: 36px 0 16px; }
.md-content h2 { font-family: var(--title); font-size: 19px; margin: 32px 0 14px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
.md-content h3 { font-family: var(--title); font-size: 16px; margin: 24px 0 10px; }
.md-content h4 { font-size: 15px; font-weight: 600; margin: 20px 0 8px; }
.md-content p { margin-bottom: 14px; }
.md-content a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.md-content img { border-radius: var(--radius-sm); margin: 16px 0; }
.md-content ul, .md-content ol { margin: 12px 0; padding-left: 24px; }
.md-content li { margin-bottom: 6px; }
.md-content blockquote {
  border-left: 3px solid var(--accent);
  padding: 10px 16px;
  margin: 16px 0;
  background: var(--accent-soft);
  border-radius: 0 var(--radius-xs) var(--radius-xs) 0;
  color: var(--text-2);
  font-size: 14px;
}
.md-content pre {
  background: var(--bg-alt);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  margin: 16px 0;
  overflow-x: auto;
  font-size: 13px;
  line-height: 1.6;
  border: 1px solid var(--border);
}
.md-content code { font-family: var(--mono); font-size: 0.9em; }
.md-content p code, .md-content li code {
  background: var(--accent-soft);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 0.85em;
}
.md-content table {
  width: 100%;
  border-collapse: collapse;
  margin: 16px 0;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}
.md-content th, .md-content td {
  padding: 10px 14px;
  border: 1px solid var(--border);
  text-align: left;
}
.md-content th { background: var(--bg-alt); font-weight: 600; }
.md-content hr { border: none; height: 1px; background: var(--border); margin: 28px 0; }

/* ========== FOOTER ========== */
.site-footer {
  border-top: 1px solid var(--border);
  padding: 40px 24px;
  text-align: center;
  font-size: 13px;
  color: var(--text-3);
}
.site-footer a { color: var(--accent); }
.footer-links { display: flex; justify-content: center; gap: 20px; margin-bottom: 12px; }
.footer-cat { font-size: 20px; margin-bottom: 8px; }
.footer-quote {
  font-size: 12px;
  color: var(--text-3);
  font-style: italic;
  margin-top: 8px;
}

/* ========== GRADIENT THUMBNAILS ========== */
.grad-0 { background: linear-gradient(135deg, #C4A882, #D4886B); }
.grad-1 { background: linear-gradient(135deg, #8B7355, #C4A882); }
.grad-2 { background: linear-gradient(135deg, #6B8F6B, #7A9EB8); }
.grad-3 { background: linear-gradient(135deg, #D4886B, #C4A882); }
.grad-4 { background: linear-gradient(135deg, #7A9EB8, #6B8F6B); }
.grad-5 { background: linear-gradient(135deg, #C4A882, #6B8F6B); }
.grad-6 { background: linear-gradient(135deg, #8B7355, #D4886B); }
.grad-7 { background: linear-gradient(135deg, #7A9EB8, #C4A882); }
.grad-icon {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 36px;
  opacity: 0.45;
}

/* ========== LOADING ========== */
.spinner {
  display: inline-block;
  width: 20px; height: 20px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-wrap { text-align: center; padding: 40px; color: var(--text-3); }

/* ========== RESPONSIVE ========== */
@media (max-width: 640px) {
  .container { padding: 0 16px; }
  .header-inner { padding: 10px 16px; gap: 10px; flex-wrap: wrap; }
  .header-search { max-width: none; order: 10; flex-basis: 100%; }
  .header-nav { display: none; }
  .hero { padding: 32px 0 20px; }
  .hero-cat { font-size: 32px; }
  .hero-stats { gap: 20px; }
  .stat-num { font-size: 22px; }
  .cat-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
  .cat-widget { padding: 10px 8px; }
  .cat-emoji { font-size: 18px; }
  .cat-name { font-size: 11px; }
  .post-grid { grid-template-columns: 1fr; gap: 12px; }
  .post-thumb { height: 120px; }
  .detail-panel { width: 100vw; }
  .detail-body { padding: 24px 20px 40px; }
  .detail-title { font-size: 22px; }
  .timeline-line, .paw-trail { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="#" class="logo" onclick="goHome()">Golden<em>Dusk</em>.log</a>
    <div class="header-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" class="search-input" id="searchInput" placeholder="서재에서 찾기..." autocomplete="off">
    </div>
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="테마 전환">&#127769;</button>
      <nav class="header-nav" id="navBtns"></nav>
    </div>
  </div>
</header>

<section class="hero container" id="heroSection">
  <span class="hero-cat">&#128049;</span>
  <h1 class="hero-title">황혼의 서재에 오신 걸 환영합니다</h1>
  <p class="hero-sub">노을이 물드는 시간, 고양이와 함께 글을 씁니다</p>
  <div class="hero-stats">
    <div class="stat"><span class="stat-num" id="totalCount">&mdash;</span><span class="stat-label">편의 기록</span></div>
    <div class="stat"><span class="stat-num" id="catCount">&mdash;</span><span class="stat-label">개 서랍</span></div>
    <div class="stat"><span class="stat-num">2023&ndash;25</span><span class="stat-label">Since</span></div>
  </div>
</section>

<section class="timeline-section container" id="timelineSection">
  <div class="section-head">
    <h2 class="section-title">&#128062; 나의 일대기</h2>
    <span class="section-sub">발자국을 따라 걸어온 길</span>
  </div>
  <div class="timeline-track">
    <div class="timeline-line"></div>
    <div class="paw-trail" id="pawTrail"></div>
    <div class="timeline-scroll" id="timeline"></div>
  </div>
</section>

<section class="cat-section container">
  <div class="section-head">
    <h2 class="section-title">서랍장</h2>
    <span class="section-sub" id="catSubtext"></span>
  </div>
  <div class="cat-grid" id="catGrid"></div>
</section>

<section class="posts-section container">
  <div class="source-filter" id="sourceFilter"></div>
  <div class="results-bar"><span id="resultsText"></span></div>
  <div class="post-grid" id="postGrid"></div>
  <button class="load-more-btn" id="loadMoreBtn" hidden onclick="loadMore()">&#128062; 더 둘러보기</button>
</section>

<footer class="site-footer">
  <div class="footer-cat">&#128049;</div>
  <div class="footer-links">
    <a href="https://velog.io/@prettylee620" target="_blank" rel="noopener">Velog</a>
    <a href="https://mellona-log.gitbook.io/log" target="_blank" rel="noopener">GitBook</a>
    <a href="https://github.com/GoldenPearls" target="_blank" rel="noopener">GitHub</a>
  </div>
  <p>GoldenDusk.log &mdash; 황혼의 서재</p>
  <p class="footer-quote">매일 조금씩, 유리병에 담아 보내는 기록들</p>
</footer>

<div class="overlay" id="overlay" onclick="closeDetail()"></div>
<div class="detail-panel" id="detailPanel">
  <div class="detail-header">
    <button class="close-btn" onclick="closeDetail()">&times;</button>
    <span class="detail-header-title" id="detailHeaderTitle"></span>
    <a class="original-link" id="detailOrigLink" href="#" target="_blank" rel="noopener">&#128220; 원문</a>
  </div>
  <div class="detail-hero" id="detailHero"></div>
  <div class="detail-body">
    <div class="detail-meta" id="detailMeta"></div>
    <h1 class="detail-title" id="detailTitle"></h1>
    <div class="md-content" id="detailContent">
      <div class="loading-wrap"><span class="spinner"></span><p style="margin-top:12px">페이지를 넘기는 중...</p></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.4/marked.min.js"></script>
<script>
let POSTS = [];
let state = { source: 'all', cat: null, search: '', visible: 24 };

const GRAD_COLORS = ['grad-0','grad-1','grad-2','grad-3','grad-4','grad-5','grad-6','grad-7'];

function gradClass(cat) {
  let h = 0;
  for (let i = 0; i < (cat||'').length; i++) h = ((h << 5) - h + cat.charCodeAt(i)) | 0;
  return GRAD_COLORS[Math.abs(h) % GRAD_COLORS.length];
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function init() {
  const res = await fetch('posts-meta.json');
  POSTS = await res.json();

  document.getElementById('totalCount').textContent = POSTS.length;
  const cats = [...new Set(POSTS.map(p => p.cat).filter(Boolean))];
  document.getElementById('catCount').textContent = cats.length;

  renderNav();
  renderTimeline();
  renderCategories();
  renderSourceFilter();
  renderPosts();

  document.getElementById('searchInput').addEventListener('input', e => {
    state.search = e.target.value.trim();
    state.visible = 24;
    renderPosts();
  });

  window.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

  initTheme();
}

function getFiltered() {
  let list = POSTS;
  if (state.source !== 'all') list = list.filter(p => p.source === state.source);
  if (state.cat) list = list.filter(p => p.cat === state.cat);
  if (state.search) {
    const q = state.search.toLowerCase();
    list = list.filter(p =>
      (p.title||'').toLowerCase().includes(q) ||
      (p.cat||'').toLowerCase().includes(q) ||
      (p.preview||'').toLowerCase().includes(q)
    );
  }
  return list;
}

function renderNav() {
  document.getElementById('navBtns').innerHTML = ['all','velog','gitbook'].map(s => {
    const label = s === 'all' ? '전체' : s === 'velog' ? 'Velog' : 'GitBook';
    return `<button class="nav-btn ${state.source===s?'active':''}" onclick="setSource('${s}')">${label}</button>`;
  }).join('');
}

function renderTimeline() {
  const retros = POSTS.filter(p => p.cat === '회고록').sort((a, b) => (a.date||'').localeCompare(b.date||''));
  const byYear = {};
  for (const r of retros) {
    const y = (r.date||'').slice(0,4);
    if (!byYear[y]) byYear[y] = r;
  }
  const entries = Object.entries(byYear).sort((a,b) => a[0].localeCompare(b[0]));

  document.getElementById('pawTrail').innerHTML = entries.map((_, i) =>
    `<span class="paw ${i === 0 ? 'active' : ''}">🐾</span>`
  ).join('');

  document.getElementById('timeline').innerHTML = entries.map(([year, p]) =>
    `<div class="tl-card" onclick="openPost(${p.id})">
      <span class="tl-paw">🐾</span>
      <div class="tl-grad">${year}</div>
      <div class="tl-body">
        <div class="tl-title">${esc(p.title)}</div>
        <div class="tl-date">${p.date || ''}</div>
      </div>
    </div>`
  ).join('');
}

function renderCategories() {
  const catMap = {};
  for (const p of POSTS) {
    const k = p.cat || '기타';
    if (!catMap[k]) catMap[k] = { count: 0, icon: p.icon || '📝' };
    catMap[k].count++;
  }
  const sorted = Object.entries(catMap).sort((a,b) => b[1].count - a[1].count);
  document.getElementById('catSubtext').textContent = sorted.length + '개의 서랍';
  document.getElementById('catGrid').innerHTML = sorted.map(([name, info]) =>
    `<button class="cat-widget ${state.cat===name?'active':''}" onclick="setCat('${esc(name)}')">
      <div class="cat-emoji">${info.icon}</div>
      <div class="cat-name">${esc(name)}</div>
      <div class="cat-count">${info.count}편</div>
    </button>`
  ).join('');
}

function renderSourceFilter() {
  const vc = POSTS.filter(p => p.source === 'velog').length;
  const gc = POSTS.filter(p => p.source === 'gitbook').length;
  document.getElementById('sourceFilter').innerHTML = [
    ['all', '전체', POSTS.length],
    ['velog', 'Velog', vc],
    ['gitbook', 'GitBook', gc]
  ].map(([k, label, cnt]) =>
    `<button class="src-btn ${state.source===k?'active':''}" onclick="setSource('${k}')">${label}<span class="cnt">${cnt}</span></button>`
  ).join('');
}

function renderPosts() {
  const filtered = getFiltered();
  const shown = filtered.slice(0, state.visible);
  document.getElementById('resultsText').textContent = filtered.length + '편의 기록' +
    (state.search ? ` · "${state.search}"` : '') +
    (state.cat ? ` · ${state.cat}` : '');

  document.getElementById('postGrid').innerHTML = shown.map(p => {
    const hasThumb = p.thumb && p.thumb.startsWith('http');
    const thumbStyle = hasThumb ? `background-image:url('${esc(p.thumb)}')` : '';
    const thumbClass = hasThumb ? '' : gradClass(p.cat);
    return `<div class="post-card" onclick="openPost(${p.id})">
      <div class="post-thumb ${thumbClass}" style="${thumbStyle}">
        ${!hasThumb ? `<span class="grad-icon">${p.icon||'📝'}</span>` : ''}
        <span class="src-tag ${p.source}">${p.source === 'velog' ? 'Velog' : 'GitBook'}</span>
      </div>
      <div class="post-body">
        <div class="post-cat-badge">${p.icon||''} ${esc(p.cat||'')}</div>
        <div class="post-title-text">${esc(p.title)}</div>
        <div class="post-preview-text">${esc(p.preview||'')}</div>
        <div class="post-footer"><span>${p.date||''}</span></div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('loadMoreBtn').hidden = shown.length >= filtered.length;
}

function setSource(s) {
  state.source = s;
  state.cat = null;
  state.visible = 24;
  renderNav();
  renderSourceFilter();
  renderCategories();
  renderPosts();
}

function setCat(c) {
  state.cat = state.cat === c ? null : c;
  state.visible = 24;
  renderCategories();
  renderPosts();
}

function loadMore() {
  state.visible += 24;
  renderPosts();
}

function goHome() {
  state = { source: 'all', cat: null, search: '', visible: 24 };
  document.getElementById('searchInput').value = '';
  renderNav();
  renderSourceFilter();
  renderCategories();
  renderPosts();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function openPost(id) {
  const p = POSTS.find(x => x.id === id);
  if (!p) return;

  document.getElementById('overlay').classList.add('open');
  document.getElementById('detailPanel').classList.add('open');
  document.body.style.overflow = 'hidden';

  document.getElementById('detailHeaderTitle').textContent = p.title;
  document.getElementById('detailTitle').textContent = p.title;

  const origLink = document.getElementById('detailOrigLink');
  if (p.url) { origLink.href = p.url; origLink.hidden = false; }
  else { origLink.hidden = true; }

  const hero = document.getElementById('detailHero');
  if (p.thumb && p.thumb.startsWith('http')) {
    hero.style.backgroundImage = `url('${p.thumb}')`;
    hero.style.display = '';
    hero.style.height = '';
    hero.className = 'detail-hero';
  } else {
    hero.className = `detail-hero ${gradClass(p.cat)}`;
    hero.style.backgroundImage = '';
    hero.style.height = '80px';
  }

  document.getElementById('detailMeta').innerHTML =
    `<span class="cat-badge">${p.icon||''} ${esc(p.cat||'')}</span>` +
    `<span>${p.date||''}</span>` +
    `<span>${p.source === 'velog' ? 'Velog' : 'GitBook'}</span>`;

  const contentEl = document.getElementById('detailContent');
  contentEl.innerHTML = '<div class="loading-wrap"><span class="spinner"></span><p style="margin-top:12px">페이지를 넘기는 중...</p></div>';
  contentEl.style.opacity = '0';
  contentEl.style.transform = 'rotateY(-3deg) translateX(20px)';
  contentEl.style.transition = 'none';

  try {
    const res = await fetch(`content/${id}.md`);
    if (res.ok) {
      const md = await res.text();
      contentEl.innerHTML = marked.parse(md);
    } else {
      contentEl.innerHTML = '<p style="color:var(--text-3)">콘텐츠를 불러올 수 없습니다.</p>';
    }
  } catch (e) {
    contentEl.innerHTML = '<p style="color:var(--text-3)">콘텐츠를 불러올 수 없습니다.</p>';
  }

  requestAnimationFrame(() => {
    contentEl.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
    contentEl.style.opacity = '1';
    contentEl.style.transform = 'rotateY(0) translateX(0)';
  });

  document.getElementById('detailPanel').scrollTop = 0;
}

function closeDetail() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('detailPanel').classList.remove('open');
  document.body.style.overflow = '';
  const hero = document.getElementById('detailHero');
  hero.style.height = '';
  hero.className = 'detail-hero';
}

function initTheme() {
  const saved = localStorage.getItem('goldendusk-theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  updateThemeIcon();
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const isDark = current === 'dark' ||
    (!current && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const next = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('goldendusk-theme', next);
  updateThemeIcon();
}

function updateThemeIcon() {
  const current = document.documentElement.getAttribute('data-theme');
  const isDark = current === 'dark' ||
    (!current && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.getElementById('themeToggle').innerHTML = isDark ? '&#9728;&#65039;' : '&#127769;';
}

init();
</script>
</body>
</html>
